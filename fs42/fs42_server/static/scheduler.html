<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scheduler — myHomeTV</title>
  <link rel="stylesheet" href="https://unpkg.com/purecss@3.0.0/build/pure-min.css">
  <link rel="stylesheet" id="theme-css" href="/static/themes/default.css">
  <style>
    .scheduler-shell{max-width:980px;margin:auto}.scheduler-grid{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(320px,1.2fr);gap:24px}.card{padding:20px;border:1px solid #34404d;border-radius:10px;background:#111821}.slot-list{display:grid;gap:7px;max-height:62vh;overflow:auto}.slot{padding:10px 12px;border:1px solid #34404d;border-radius:7px;color:#dce6ef;background:#18222d;text-align:left}.slot.active{border-color:#61cfff;background:#173b59}.slot small{display:block;margin-top:3px;color:#91a0af}.policy{display:grid;gap:14px}.policy label{display:grid;gap:6px;color:#b9c5d1}.policy input,.policy select{min-height:42px;padding:8px;border:1px solid #465463;border-radius:6px;color:#f4f8fb;background:#0b1118}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.hint{color:#91a0af;line-height:1.5}.status{min-height:1.5em;color:#61cfff}.empty{padding:20px;color:#91a0af;text-align:center}.history{display:grid;gap:7px;margin-top:14px}.history-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 11px;border-radius:6px;background:#0b1118}.history-row small{grid-column:1/-1;color:#91a0af}.danger{color:#fff!important;background:#8f2432!important}.history-editor{margin-top:16px;border-top:1px solid #34404d;padding-top:14px}.history-airings{max-height:260px;overflow:auto}.compact{padding:5px 8px;font-size:.82em}@media(max-width:720px){.scheduler-grid{grid-template-columns:1fr}.slot-list{max-height:32vh}}
  </style>
</head>
<body>
  <script src="/static/common.js?v=myhometv-20260801"></script>
  <script src="/static/fs42_client.js"></script>
  <script>
  (()=>{
    const days=["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
    let stationName="",documentConfig=null,config=null,selected=null,editingSeries="";
    const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    document.addEventListener("DOMContentLoaded",async()=>{
      window.fs42Common.initTheme();stationName=new URLSearchParams(location.search).get("station")||"";
      const content=`<div class="scheduler-shell"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center"><div><h1>Realistic Scheduler</h1><p class="hint">Choose a weekly series slot and define how new episodes and reruns should air.</p></div><a class="pure-button" href="/static/stations.html">← Stations</a></div><div class="scheduler-grid"><section><div class="card"><h2>Weekly slots</h2><div id="slots" class="slot-list"><div class="empty">Loading…</div></div></div><div class="card" style="margin-top:18px"><h2>Channel history</h2><div id="history" class="history"><div class="empty">Loading…</div></div></div></section><section class="card"><div id="empty" class="empty">Choose a slot that contains a series tag.</div><form id="policy" class="policy" hidden><h2 id="slot-title"></h2><label>Broadcast behavior<select id="mode"><option value="mixed">New when due, otherwise rerun</option><option value="premiere">New episode slot</option><option value="rerun">Reruns only</option></select></label><label>Series name (optional)<input id="series" placeholder="When this tag contains multiple shows"></label><label>Minimum days before repeating a rerun<input id="gap" type="number" min="0" max="365" value="7"></label><label>After the final episode<select id="end-policy"><option value="reruns">Continue with curated reruns</option><option value="restart_after_hiatus">Restart as reruns after a hiatus</option><option value="hold">Use fallback programming</option></select></label><label>Hiatus before restarting reruns (weeks)<input id="hiatus" type="number" min="1" max="104" value="13"></label><label>Fallback tag (optional)<input id="fallback" placeholder="Used when no episode is eligible"></label><p class="hint">The first canonical episode not already aired or reserved becomes NEW. Reruns come only from episodes whose premiere airtime has passed.</p><div class="actions"><button class="pure-button pure-button-primary" type="submit">Save scheduler policy</button><button class="pure-button" id="remove" type="button">Use legacy scheduling</button></div><div class="status" id="status"></div></form></section></div></div>`;
      document.body.innerHTML=await window.fs42Common.createPageLayout("",content);
      document.querySelector("#gap").closest("label").insertAdjacentHTML("beforebegin",`<label>When an episode file is missing<select id="catch-up"><option value="advance_available">Continue with the next available episode</option><option value="wait_for_missing">Wait and use fallback/reruns</option></select></label>`);
      document.querySelector("#series").closest("label").insertAdjacentHTML("afterend",`<label>New episode cadence (weeks)<input id="cadence-weeks" type="number" min="1" max="52" value="1"></label>`);
      document.querySelector("#gap").closest("label").insertAdjacentHTML("afterend",`<label>Keep reruns to the newest seasons (optional)<input id="recent-seasons" type="number" min="1" max="100" placeholder="All aired seasons"></label><label>Premiere season begins (optional)<input id="season-start" type="date"></label><label>Premiere season ends (optional)<input id="season-end" type="date"></label>`);
      document.querySelector("#policy .hint").insertAdjacentHTML("afterend",`<div><strong>Next six broadcasts</strong><div id="slot-preview" class="history"><div class="empty">Save a policy to preview it.</div></div></div>`);
      document.querySelector("#history").closest(".card").insertAdjacentHTML("afterend",`<form id="promo-policy" class="card policy" style="margin-top:18px"><h2>Channel promos</h2><label><span><input id="promos-enabled" type="checkbox" checked> Generate schedule-aware promos</span></label><label>Frequency<select id="promo-intensity"><option value="rare">Rare</option><option value="normal">Normal</option><option value="frequent">Frequent</option></select></label><label>Minimum hours apart<input id="promo-spacing" type="number" min="6" max="336" value="24"></label><button class="pure-button" type="submit">Save promo settings</button><div id="promo-status" class="status"></div></form>`);
      document.querySelector("#policy").addEventListener("submit",save);document.querySelector("#remove").addEventListener("click",removePolicy);await load();
      document.querySelector("#promo-policy").addEventListener("submit",savePromoSettings);
    });
    async function load(){if(!stationName){show("No station was selected.");return}const data=await window.fs42Api.get(`stations/${encodeURIComponent(stationName)}`);documentConfig=data.station_config;config=documentConfig.station_conf;renderSlots();renderPromoSettings();await renderHistory();}
    function allSlots(){const result=[];days.forEach(day=>Object.entries(config[day]||{}).forEach(([hour,slot])=>{if(slot&&slot.tags)result.push({day,hour,slot});}));return result.sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||Number(a.hour)-Number(b.hour));}
    function renderSlots(){const slots=allSlots(),root=document.querySelector("#slots");root.innerHTML=slots.length?slots.map((item,index)=>`<button class="slot" data-index="${index}"><strong>${capitalize(item.day)} · ${formatHour(item.hour)}</strong><small>${esc(Array.isArray(item.slot.tags)?item.slot.tags.join(" / "):item.slot.tags)}${item.slot.programming?" · Realistic":""}</small></button>`).join(""):`<div class="empty">No tagged weekly slots found.</div>`;root.querySelectorAll("button").forEach(button=>button.onclick=()=>selectSlot(slots[Number(button.dataset.index)],button));}
    function selectSlot(item,button){selected=item;document.querySelectorAll(".slot").forEach(x=>x.classList.remove("active"));button.classList.add("active");document.querySelector("#empty").hidden=true;document.querySelector("#policy").hidden=false;const p=item.slot.programming||{};document.querySelector("#slot-title").textContent=`${capitalize(item.day)} at ${formatHour(item.hour)}`;document.querySelector("#mode").value=p.mode||"mixed";document.querySelector("#series").value=p.series||"";document.querySelector("#cadence-weeks").value=p.premiere_interval_weeks??1;document.querySelector("#catch-up").value=p.catch_up_policy||"advance_available";document.querySelector("#gap").value=p.minimum_rerun_gap_days??7;document.querySelector("#recent-seasons").value=p.rerun_recent_seasons||"";document.querySelector("#season-start").value=p.premiere_start_date||"";document.querySelector("#season-end").value=p.premiere_end_date||"";document.querySelector("#end-policy").value=p.library_end_policy||"reruns";document.querySelector("#hiatus").value=p.restart_hiatus_weeks??13;document.querySelector("#fallback").value=p.fallback_tag||"";show("");loadPreview();}
    async function save(event){event.preventDefault();if(!selected)return;const series=document.querySelector("#series").value.trim(),fallback=document.querySelector("#fallback").value.trim(),recent=document.querySelector("#recent-seasons").value,start=document.querySelector("#season-start").value,end=document.querySelector("#season-end").value,tag=Array.isArray(selected.slot.tags)?selected.slot.tags[0]:selected.slot.tags,anchor=selected.slot.programming?.cadence_anchor_date||start||new Date().toISOString().slice(0,10);selected.slot.programming={mode:document.querySelector("#mode").value,slot_id:selected.slot.programming?.slot_id||`${selected.day}-${String(selected.hour).padStart(2,"0")}-${slug(tag)}`,premiere_cadence:"weekly",premiere_interval_weeks:Number(document.querySelector("#cadence-weeks").value),cadence_anchor_date:anchor,catch_up_policy:document.querySelector("#catch-up").value,minimum_rerun_gap_days:Number(document.querySelector("#gap").value),library_end_policy:document.querySelector("#end-policy").value,restart_hiatus_weeks:Number(document.querySelector("#hiatus").value)};if(series)selected.slot.programming.series=series;if(fallback)selected.slot.programming.fallback_tag=fallback;if(recent)selected.slot.programming.rerun_recent_seasons=Number(recent);if(start)selected.slot.programming.premiere_start_date=start;if(end)selected.slot.programming.premiere_end_date=end;await persist();}
    async function removePolicy(){if(!selected)return;delete selected.slot.programming;await persist();}
    async function persist(){show("Saving…");try{await window.fs42Api.put(`stations/${encodeURIComponent(stationName)}`,documentConfig);show("Saved. Regenerate the future schedule to apply this policy.");renderSlots();await Promise.all([renderHistory(),loadPreview()]);}catch(error){show(error.detail||error.message||"Could not save scheduler policy.");}}
    async function renderHistory(){const root=document.querySelector("#history");try{const data=await window.fs42Api.get(`stations/${encodeURIComponent(stationName)}/scheduler-history`),rows=data.series||[];root.innerHTML=rows.length?rows.map(row=>`<div class="history-row"><strong>${esc(row.series_key.replaceAll("-"," "))}</strong><button class="pure-button compact edit-history" data-series="${esc(row.series_key)}">Edit history</button><span>${row.aired_count} aired · ${row.reserved_count} scheduled</span><small>${row.next_override?`Manual next: S${row.next_override.season}E${row.next_override.episode} · `:""}${row.next_reserved?`Reserved: ${new Date(row.next_reserved).toLocaleString()}`:"No future premiere reserved"}</small></div>`).join(""):`<div class="empty">History begins when realistic scheduling is generated.</div>`;root.querySelectorAll(".edit-history").forEach(button=>button.onclick=()=>openHistory(button.dataset.series));}catch(error){root.innerHTML=`<div class="empty">History is unavailable.</div>`;}}
    async function openHistory(series){editingSeries=series;let editor=document.querySelector("#history-editor");if(!editor){document.querySelector("#history").insertAdjacentHTML("afterend",`<div id="history-editor" class="history-editor"><h3 id="history-title"></h3><p class="hint">Premieres always follow numeric season and episode order. Set the next episode to intentionally skip earlier files, or start over to return to the first episode.</p><div class="actions"><label>Next season <input id="next-season" type="number" min="0" value="1" style="width:76px"></label><label>Next episode <input id="next-episode" type="number" min="1" value="1" style="width:76px"></label><button id="set-next" class="pure-button pure-button-primary">Set next episode</button><button id="clear-future" class="pure-button">Remove future reservations</button><button id="reset-series" class="pure-button danger">Remove history and start over</button></div><div id="history-edit-status" class="status"></div><div id="history-airings" class="history history-airings"></div></div>`);editor=document.querySelector("#history-editor");document.querySelector("#set-next").onclick=()=>historyCommand("set_next",{season:Number(document.querySelector("#next-season").value),episode:Number(document.querySelector("#next-episode").value)});document.querySelector("#clear-future").onclick=()=>historyCommand("clear_future",{},"Remove all future reservations for this series?");document.querySelector("#reset-series").onclick=()=>historyCommand("reset_series",{},"Remove ALL aired and scheduled history for this series and restart chronologically from S1E1?");}editor.hidden=false;document.querySelector("#history-title").textContent=`Edit ${series.replaceAll("-"," ")}`;const data=await window.fs42Api.get(`stations/${encodeURIComponent(stationName)}/scheduler-history/${encodeURIComponent(series)}`);if(data.cursor){document.querySelector("#next-season").value=data.cursor[0];document.querySelector("#next-episode").value=data.cursor[1];}document.querySelector("#history-airings").innerHTML=data.airings.length?data.airings.map(item=>`<div class="history-row"><strong>S${item.season}E${item.episode}${esc(item.part||"")}</strong><button class="pure-button compact remove-airing" data-id="${item.id}">Remove</button><span>${esc(item.status)} · ${esc(item.airing_kind)}</span><small>${new Date(item.scheduled_start).toLocaleString()}</small></div>`).join(""):`<div class="empty">No history entries.</div>`;document.querySelectorAll(".remove-airing").forEach(button=>button.onclick=()=>historyCommand("remove_entry",{row_id:Number(button.dataset.id)},"Remove this history entry?"));}
    async function historyCommand(action,extra={},confirmation=""){if(confirmation&&!confirm(confirmation))return;const node=document.querySelector("#history-edit-status");node.textContent="Updating…";try{const result=await window.fs42Api.post(`stations/${encodeURIComponent(stationName)}/scheduler-history/edit`,{action,series_key:editingSeries,...extra});node.textContent=result.message;await Promise.all([renderHistory(),openHistory(editingSeries),selected?loadPreview():Promise.resolve()]);}catch(error){node.textContent=error.detail||error.message||"Could not update history.";}}
    async function loadPreview(){const root=document.querySelector("#slot-preview");if(!selected?.slot?.programming){root.innerHTML=`<div class="empty">Save a policy to preview it.</div>`;return}root.innerHTML=`<div class="empty">Calculating…</div>`;try{const data=await window.fs42Api.get(`stations/${encodeURIComponent(stationName)}/scheduler-preview?day=${encodeURIComponent(selected.day)}&hour=${encodeURIComponent(selected.hour)}&weeks=6`);root.innerHTML=data.preview.map(item=>`<div class="history-row"><strong>${new Date(item.start).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}</strong><span>${item.status.toUpperCase()}</span><small>${item.series?`${esc(item.series)} · S${item.season}E${item.episode}${esc(item.part||"")}`:`Fallback: ${esc(item.fallback_tag||"off air")}`}</small></div>`).join("");}catch(error){root.innerHTML=`<div class="empty">${esc(error.detail||error.message||"Preview unavailable")}</div>`;}}
    function renderPromoSettings(){const p=config.schedule_promos===false?{enabled:false}:(config.schedule_promos||{});document.querySelector("#promos-enabled").checked=p.enabled!==false;document.querySelector("#promo-intensity").value=p.intensity||"normal";document.querySelector("#promo-spacing").value=p.minimum_spacing_hours??24;}
    async function savePromoSettings(event){event.preventDefault();config.schedule_promos={enabled:document.querySelector("#promos-enabled").checked,intensity:document.querySelector("#promo-intensity").value,minimum_spacing_hours:Number(document.querySelector("#promo-spacing").value),duration:6,lead_hours:72};const node=document.querySelector("#promo-status");node.textContent="Saving…";try{await window.fs42Api.put(`stations/${encodeURIComponent(stationName)}`,documentConfig);node.textContent="Saved. Promos regenerate with the next schedule build.";}catch(error){node.textContent=error.detail||error.message||"Could not save promo settings.";}}
    function show(message){const node=document.querySelector("#status");if(node)node.textContent=message;}function capitalize(value){return value.charAt(0).toUpperCase()+value.slice(1)}function formatHour(value){const h=Number(value);return `${h%12||12}:00 ${h<12?"AM":"PM"}`}function slug(value){return String(value).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"series"}
  })();
  </script>
</body>
</html>
