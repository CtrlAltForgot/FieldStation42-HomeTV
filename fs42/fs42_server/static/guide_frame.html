<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>myHomeTV Guide</title>
  <link rel="stylesheet" href="/static/guide.css?v=myhometv-20260801-channel-nav-1">
  <script defer src="/static/vendor/hls.min.js"></script>
  <script defer src="/static/fs42_client.js"></script>
  <script defer src="/static/common.js"></script>
  <script defer src="/static/guide.js?v=myhometv-20260801-channel-nav-1"></script>
</head>
<body>
  <main id="guide-app" aria-label="Program guide">
    <section id="preview" aria-live="polite">
      <div id="preview-media">
        <img id="preview-art" alt="" hidden>
        <video id="preview-video" autoplay muted playsinline disablepictureinpicture controlslist="nopictureinpicture" hidden></video>
        <iframe id="preview-live-news" title="Live news preview" allow="autoplay; encrypted-media" tabindex="-1" hidden></iframe>
        <span id="preview-status">GUIDE</span>
        <div id="artwork-loading" class="media-loading" hidden><span>Artwork unavailable</span></div>
        <div id="preview-loading" class="media-loading" hidden><i></i><span>Preview loading</span></div>
      </div>
      <div id="preview-copy">
        <p id="preview-kicker">MYHOMETV</p>
        <h1 id="preview-title">Loading your channels…</h1>
        <p id="preview-meta"></p>
        <p id="preview-description">The guide will begin at the program airing now.</p>
        <div id="preview-progress" hidden><span></span></div>
      </div>
      <div id="preview-actions">
        <button id="watch-button" hidden><span aria-hidden="true">▶</span> Watch now</button>
        <button id="now-button">Return to now</button>
        <p><kbd>Arrows</kbd> Browse&nbsp;&nbsp; <kbd>OK</kbd> Watch&nbsp;&nbsp; <kbd>Back</kbd> Close</p>
      </div>
    </section>

    <section id="listings" aria-label="Channel listings">
      <div id="guide-scroll" tabindex="-1">
        <div id="timeline"></div>
        <div id="rows"></div>
      </div>
      <div id="guide-message" role="status">Loading guide…</div>
    </section>
  </main>
</body>
</html>
