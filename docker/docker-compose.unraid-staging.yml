name: myhometv

services:
  myhometv:
    build:
      context: "${FS42_APP_PATH:-/mnt/user/appdata/fieldstation42-hometv/app}"
      dockerfile: docker/Dockerfile.hometv
    image: myhometv:staging
    container_name: myhometv
    restart: unless-stopped
    init: true
    runtime: nvidia
    ports:
      - "4243:4242"
    environment:
      FS42_SERVER_HOST: "0.0.0.0"
      FS42_SERVER_PORT: "4242"
      FS42_DB_PATH: "/app/runtime/fs42_fluid.db"
      FS42_HLS_DIR: "/app/runtime/hls"
      FS42_LOG_DIR: "/app/logs"
      FS42_HEADLESS: "1"
      FS42_HLS_IDLE_SECONDS: "${FS42_HLS_IDLE_SECONDS:-30}"
      FS42_HLS_MAX_SESSIONS: "${FS42_HLS_MAX_SESSIONS:-4}"
      FS42_HLS_TRANSCODE_THREADS: "${FS42_HLS_TRANSCODE_THREADS:-2}"
      FS42_HLS_VIDEO_ENCODER: "h264_nvenc"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      OPENSUBTITLES_API_KEY: "${OPENSUBTITLES_API_KEY:-}"
      FS42_CHANNEL_BUMPER_DIR: "/app/catalog/channel_bumpers"
      FS42_SCAN_CONCURRENCY: "${FS42_SCAN_CONCURRENCY:-2}"
      FS42_SCAN_THREADS: "${FS42_SCAN_THREADS:-1}"
      TZ: "${TZ:-America/Chicago}"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
    volumes:
      - "/mnt/user/Media:/media:ro"
      - "/mnt/user/appdata/fieldstation42-hometv/confs:/app/confs"
      - "/mnt/user/appdata/fieldstation42-hometv/catalog:/app/catalog"
      - "/mnt/user/appdata/fieldstation42-hometv/runtime:/app/runtime"
      - "/mnt/user/appdata/fieldstation42-hometv/runtime/logs:/app/logs"
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4242/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.myhometv.deployment: "unraid-staging"
      com.myhometv.repository: "/mnt/user/appdata/fieldstation42-hometv/app"
    security_opt:
      - no-new-privileges:true
